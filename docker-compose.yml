# Local PostgreSQL for BallKnower (database mode).
#   docker compose up -d --wait
services:
  db:
    image: postgres:16-alpine
    container_name: ballknower-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ballknower
      POSTGRES_PASSWORD: ballknower
      POSTGRES_DB: ballknower
    ports:
      - "5432:5432"
    volumes:
      - ballknower_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballknower -d ballknower"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  ballknower_pgdata:
